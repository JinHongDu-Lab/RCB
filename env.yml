# Environment for the simulation, evaluation, LaLonde and Replogle studies.
#
#     conda env create -f env.yml
#     conda activate rcb
#
# Minor versions are pinned rather than patch versions.  That buys portability
# at the cost of exactness: the entropy solver's weights move at the 1e-8
# level between two builds of this stack.  `requirements.txt` records exact
# versions for that reason; the two files answer different questions.
#
# The paper's results were produced under Python 3.10.0,
# numpy 2.2.6, scipy 1.15.3, scikit-learn 1.7.2 and matplotlib 3.10.8, as
# `results/simulation/package_versions.json` records for each run.
name: rcb
channels:
  - conda-forge
dependencies:
  - python=3.10.*
  - numpy=2.2.*
  - pandas=2.3.*
  - scipy=1.15.*
  - scikit-learn=1.7.*
  - matplotlib-base=3.10.*
  - seaborn=0.13.*
  - joblib=1.5.*
  - anndata=0.11.*
  - h5py=3.16.*
  - jupyter
  - nbconvert
  - pytest
  - pip
  - pip:
      - crispyx==0.1.1

# This file deliberately names no BLAS, so it resolves on any platform.
#
# One consequence is worth knowing before you read a test failure as a bug.
# tests/test_equivalence.py asserts EXACT equality against 243 recorded
# outputs, and those were recorded on osx-arm64 against Apple Accelerate.  A
# different BLAS/LAPACK -- conda-forge's reference build, OpenBLAS, MKL --
# orders its floating-point reductions differently, so eigh and matrix
# products disagree in the last bits, moving roughly a third to a half of the
# recorded values in each of s5, s6 and s7 -- the exact count varies with the
# build -- starting at design_eigendecomposition and draw_replication, with
# every package version above already correct.  That is a limit of bit-exact
# reproduction across backends, not a defect in the code, and the differences
# are far below the manuscript's displayed precision.
#
# To reproduce those bytes on osx-arm64, add Accelerate after creating the
# environment:
#
#     conda install -n rcb -c conda-forge "libblas=*=*accelerate"
#
# The spurious divide-by-zero/overflow/invalid RuntimeWarnings that
# rcb.dgp.symmetric_sqrt documents are the visible sign that it is in use.
# On any other platform, expect exactly those three parametrizations to fail
# and every other test to pass -- measured on conda-forge's netlib build:
# 3 failed, 62 passed.  Run
#
#     python -m pytest code/tests --deselect code/tests/test_equivalence.py
#
# for a green suite that still checks behavior rather than bytes.
